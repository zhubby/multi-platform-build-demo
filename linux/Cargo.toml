[package]
name = "tasknotes"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["dep:gtk"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
url = "2.5.8"
ureq = { version = "2.12.1", features = ["json"] }
gtk = { package = "gtk4", version = "0.9.7", optional = true, features = ["v4_12"] }

[[bin]]
name = "tasknotes"
path = "src/main.rs"
required-features = ["desktop"]
